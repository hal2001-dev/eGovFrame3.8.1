# =====================================================================
#  Oracle 접속 설정 (oracle 프로파일에서만 사용됨:
#  -Dspring.profiles.active=oracle 로 기동할 때).
#  실제 환경에 맞게 수정하세요. 비밀번호는 외부화(암호화/Vault)를 권장합니다.
# =====================================================================

oracle.driverClassName=oracle.jdbc.OracleDriver

# 서비스 이름(service name) 방식 (권장):
oracle.url=jdbc:oracle:thin:@//DB_HOST:1521/ORCLPDB1
# SID 방식 대안:
#oracle.url=jdbc:oracle:thin:@DB_HOST:1521:ORCL

oracle.username=egov
oracle.password=change-me

# 커넥션 풀 설정 (commons-dbcp)
oracle.pool.initialSize=2
oracle.pool.maxActive=20
oracle.pool.maxIdle=5
