# =====================================================================
#  Oracle connection settings (used only when the 'oracle' Spring profile
#  is active: start with -Dspring.profiles.active=oracle).
#  EDIT these for your environment. Consider externalizing the password.
# =====================================================================

oracle.driverClassName=oracle.jdbc.OracleDriver

# Service name (recommended):
oracle.url=jdbc:oracle:thin:@//DB_HOST:1521/ORCLPDB1
# SID style alternative:
#oracle.url=jdbc:oracle:thin:@DB_HOST:1521:ORCL

oracle.username=egov
oracle.password=change-me

# connection pool (commons-dbcp)
oracle.pool.initialSize=2
oracle.pool.maxActive=20
oracle.pool.maxIdle=5
