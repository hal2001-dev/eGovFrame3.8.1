# =====================================================================
#  HMAC / API deployment settings.
#
#  NOTE: API keys, secrets and per-client allowed IPs are managed in the
#        DATABASE (API_CLIENT / API_CLIENT_IP), not here. This file only
#        holds deployment-level knobs.
# =====================================================================

# allowed clock skew for the X-API-TIMESTAMP header (seconds)
hmac.skewSeconds=300

# --- global source IP allow-list (optional) -------------------------------
# CIDR blocks / single IPs, comma or space separated. Class C = /24.
# Empty (default) = no global restriction (per-client rules in DB still apply).
#ip.whitelist=203.0.113.0/24, 10.1.0.0/16, 198.51.100.10

# --- client IP behind an L4 + web server (proxy) --------------------------
# With an L4 + Apache/nginx in front, request.getRemoteAddr() is the PROXY IP,
# so IP allow-lists won't work unless we read the real client IP from a header
# that the web server sets. Enable ONE of the following in your environment:
#
#   ip.forwardedHeader=X-Real-IP          # single value set by the web server (recommended)
#   ip.forwardedHeader=X-Forwarded-For    # may be a comma list: "client, proxy1, ..."
#
# For X-Forwarded-For, by default we take the LEFTMOST value as the client,
# which is correct only if the edge (web server) OVERWRITES any client-supplied
# header. For a fixed proxy chain that appends on the right, pick a token counted
# from the right instead (0 = rightmost):
#   ip.forwardedFromRight=1
#
# See README section 4-3 for nginx / Apache configuration snippets.
#ip.forwardedHeader=X-Real-IP
#ip.forwardedFromRight=
