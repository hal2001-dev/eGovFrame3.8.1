# =====================================================================
#  HMAC / API 배포 설정.
#
#  주의: API 키 / 비밀키 / 클라이언트별 허용 IP 는 이 파일이 아니라
#        데이터베이스(API_CLIENT / API_CLIENT_IP)에서 관리합니다.
#        이 파일에는 배포 단위 설정값만 둡니다.
# =====================================================================

# X-API-TIMESTAMP 허용 오차(초). 서버 시각과 이 범위를 벗어나면 재전송으로 간주해 거부.
hmac.skewSeconds=300

# --- 전역 허용 IP 대역 (선택) ---------------------------------------------
# CIDR 대역 / 단일 IP 를 콤마 또는 공백으로 구분. C 클래스 = /24.
# 비워두면(기본) 전역 제한 없음 (DB 의 클라이언트별 규칙은 그대로 적용).
#ip.whitelist=203.0.113.0/24, 10.1.0.0/16, 198.51.100.10

# --- L4 + 웹서버(프록시) 뒤에 있을 때의 실제 클라이언트 IP -----------------
# 앞단에 L4 + Apache/nginx 가 있으면 request.getRemoteAddr() 는 프록시 IP 라서
# IP 화이트리스트가 무의미해집니다. 웹서버가 실제 클라이언트 IP 를 넣어주는 헤더를
# 지정하세요(운영 환경에서 아래 중 하나를 사용):
#
#   ip.forwardedHeader=X-Real-IP          # 웹서버가 넣는 단일 값 (권장)
#   ip.forwardedHeader=X-Forwarded-For    # 콤마 리스트일 수 있음: "client, proxy1, ..."
#
# X-Forwarded-For 의 경우 기본은 맨 왼쪽 값을 클라이언트로 봅니다. 이는 엣지(웹서버)가
# 클라이언트가 보낸 헤더를 덮어쓸 때만 안전합니다. 오른쪽에 값을 덧붙이는 고정 프록시
# 체인이라면 오른쪽 기준 인덱스로 특정 값을 고르세요(0 = 맨 오른쪽):
#   ip.forwardedFromRight=1
#
# nginx / Apache 설정 예시는 저장소 README 의 4-3 절 참고.
#ip.forwardedHeader=X-Real-IP
#ip.forwardedFromRight=
